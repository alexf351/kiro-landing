<body>
  <main>
    <img src="/assets/kiro-app-icon-256.png" alt="Iro AI"/>
    <h1 id="dlTitle">Opening Iro</h1>
    <p id="dlSub">Sending you to the App Store.</p>
    <a class="btn" id="downloadLink" href="https://apps.apple.com/us/app/iro-ai-learn-ai-skills/id6759628066">Download on the App Store</a>
    <p class="hint" id="dlHint">If nothing happens, tap the button.</p>

    <!-- Shown only if the automatic escape fails. -->
    <ol class="steps" id="dlSteps" hidden>
      <li>Tap <b>&hellip;</b> or <b>&#8942;</b> in the top-right of this screen</li>
      <li>Choose <b>Open in browser</b></li>
      <li>Tap <b>Download on the App Store</b> again</li>
    </ol>
    <button class="linkbtn" id="dlCopy" hidden>or copy the link</button>
  </main>

  <script>
    (function(){
      var APPSTORE = 'https://apps.apple.com/us/app/iro-ai-learn-ai-skills/id6759628066';
      var WEBAPP   = 'https://app.tryiro.com/';

      var ua    = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var target = isIOS ? APPSTORE : WEBAPP;

      var link = document.getElementById('downloadLink');
      if (!isIOS) { link.href = WEBAPP; link.textContent = 'Open the web app'; }

      var APPS = [
        { name:'instagram', label:'Instagram', re:/Instagram/i },
        { name:'facebook',  label:'Facebook',  re:/FBAN|FBAV|FBIOS|FB_IAB|FB4A/i },
        { name:'tiktok',    label:'TikTok',    re:/BytedanceWebview|ByteLocale|musical_ly|aweme|trill|TikTok/i },
        { name:'snapchat',  label:'Snapchat',  re:/Snapchat/i },
        { name:'linkedin',  label:'LinkedIn',  re:/LinkedInApp/i },
        { name:'pinterest', label:'Pinterest', re:/Pinterest/i },
        { name:'twitter',   label:'X',         re:/Twitter/i },
        { name:'line',      label:'LINE',      re:/\bLine\//i }
      ];
      var hit = null;
      for (var i = 0; i < APPS.length; i++) { if (APPS[i].re.test(ua)) { hit = APPS[i]; break; } }

      // Apple answers every apps.apple.com URL with a 301 to itms-appss://, and
      // in-app browsers refuse to follow a custom scheme. So the store link can
      // never work from inside one: the page has to get itself out to the real
      // browser first, and each app has its own way out.
      function escapeUrl(){
        if (!hit) return null;
        if (hit.name === 'instagram') return 'instagram://extbrowser/?url=' + encodeURIComponent(target);
        // TikTok refuses x-safari- and answers with an "Action can't be completed"
        // toast, which reads as our page being broken. Better to go straight to
        // instructions than to show a failure first.
        if (hit.name === 'tiktok') return null;
        if (isIOS)     return 'x-safari-' + target;
        if (isAndroid) return 'intent://' + target.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
        return null;
      }

      function track(ev, extra){
        if (!window.posthog || !window.posthog.capture) return;
        var o = { in_app_browser: hit ? hit.name : null,
                  platform: isIOS ? 'ios' : (isAndroid ? 'android' : 'other'),
                  destination: isIOS ? 'app_store' : 'web_app',
                  referrer: document.referrer || null };
        if (extra) for (var k in extra) o[k] = extra[k];
        posthog.capture(ev, o);
      }

      var handedOff = false;
      function onHide(){ if (!handedOff && document.hidden) { handedOff = true; track('download_handoff_succeeded'); } }
      document.addEventListener('visibilitychange', onHide);
      window.addEventListener('pagehide', onHide);

      function showManual(){
        if (handedOff) return;
        track('download_escape_failed');
        document.getElementById('dlTitle').textContent = 'Open in your browser to install';
        document.getElementById('dlSub').textContent =
          (hit ? hit.label : 'This app') +
          "'s built-in browser can't open the App Store. It takes a second to switch.";
        document.getElementById('dlHint').hidden = true;
        document.getElementById('dlSteps').hidden = false;

        var copy = document.getElementById('dlCopy');
        copy.hidden = false;
        copy.addEventListener('click', function(){
          var done = function(){ copy.textContent = 'Link copied, paste it in your browser'; };
          var url = window.location.origin + '/download';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done).catch(done);
          } else {
            var ta = document.createElement('textarea');
            ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) {}
            document.body.removeChild(ta);
          }
          track('download_link_copied');
        });
      }

      function fireEscape(){
        var esc = escapeUrl();
        if (!esc) return false;
        // Facebook's webview drops a location assignment to x-safari- but honours
        // the same URL through window.open.
        if (hit.name === 'facebook') window.open(esc, '_blank');
        else window.location.href = esc;
        return true;
      }

      var esc = escapeUrl();
      track('download_link_opened', { escape_scheme: esc ? esc.split(':')[0] : 'none' });

      // A tap is a user gesture, and iOS honours those in cases where it drops a
      // navigation the page started by itself. The button pointed straight at the
      // App Store, which cannot work from inside a webview at all, so in an in-app
      // browser it now runs the escape instead.
      if (hit && esc) {
        link.addEventListener('click', function(e){
          e.preventDefault();
          track('download_escape_attempt', { trigger: 'tap' });
          fireEscape();
          setTimeout(function(){ if (!handedOff && !document.hidden) showManual(); }, 1500);
        });
      }

      if (!hit) { window.location.href = target; return; }  // a real browser
      if (!esc) { showManual(); return; }                   // in-app, nothing worth trying

      fireEscape();
      setTimeout(function(){ if (!handedOff && !document.hidden) showManual(); }, 1500);
    })();
  </script>

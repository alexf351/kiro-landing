<body>
  <main>
    <img src="/assets/kiro-app-icon-256.png" alt="Iro AI"/>
    <h1 id="dlTitle">Opening Iro</h1>
    <p id="dlSub">Sending you to the App Store.</p>
    <a class="btn" id="downloadLink" href="https://apps.apple.com/app/id6759628066?utm_source=tiktok&utm_medium=bio&utm_campaign=profile">Download on the App Store</a>
    <p class="hint" id="dlHint">If nothing happens, tap the button.</p>

    <!-- Shown only if every automatic escape from an in-app browser fails. -->
    <ol class="steps" id="dlSteps" hidden>
      <li>Tap <b>&hellip;</b> or <b>&#8942;</b> in the top-right of this screen</li>
      <li>Choose <b>Open in browser</b></li>
      <li>Tap <b>Download on the App Store</b> again</li>
    </ol>
    <button class="linkbtn" id="dlCopy" hidden>or copy the link</button>
  </main>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var source   = params.get('source')   || params.get('utm_source')   || 'tiktok';
      var medium   = params.get('medium')   || params.get('utm_medium')   || 'bio';
      var campaign = params.get('campaign') || params.get('utm_campaign') || 'profile';
      var q = 'utm_source=' + encodeURIComponent(source) + '&utm_medium=' + encodeURIComponent(medium) + '&utm_campaign=' + encodeURIComponent(campaign);
      var appStoreUrl = 'https://apps.apple.com/app/id6759628066?' + q;
      var itmsUrl     = 'itms-apps://apps.apple.com/app/id6759628066?' + q;
      var selfUrl     = window.location.origin + '/download?' + q + '&esc=1';

      var link = document.getElementById('downloadLink');
      if (link) link.href = appStoreUrl;

      var ua = navigator.userAgent || '';
      var IAB = [
        { name:'instagram', re:/Instagram/i },
        { name:'tiktok',    re:/BytedanceWebview|musical_ly|TikTok|Bytedance/i },
        { name:'facebook',  re:/FBAN|FBAV|FB_IAB|FB4A/i },
        { name:'snapchat',  re:/Snapchat/i },
        { name:'linkedin',  re:/LinkedInApp/i },
        { name:'pinterest', re:/Pinterest/i },
        { name:'twitter',   re:/Twitter/i },
        { name:'line',      re:/\bLine\//i }
      ];
      var hitObj = null;
      for (var i = 0; i < IAB.length; i++) { if (IAB[i].re.test(ua)) { hitObj = IAB[i]; break; } }
      var inApp = !!hitObj;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var escaped = params.get('esc') === '1';   // we already bounced to a real browser

      var props = {
        source:source, medium:medium, campaign:campaign,
        utm_source:source, utm_medium:medium, utm_campaign:campaign,
        '$utm_source':source, '$utm_medium':medium, '$utm_campaign':campaign,
        landing_path:window.location.pathname,
        visible_url:window.location.origin + window.location.pathname,
        destination:'app_store',
        referrer:document.referrer || null,
        user_agent:ua || null,
        in_app_browser: inApp ? hitObj.name : null,
        platform: isIOS ? 'ios' : (/Android/i.test(ua) ? 'android' : 'other'),
        arrived_via_escape: escaped
      };
      function track(ev, extra){
        if (!window.posthog) return;
        var o = {}; for (var k in props) o[k] = props[k];
        if (extra) for (var j in extra) o[j] = extra[j];
        posthog.capture(ev, o);
      }
      if (window.posthog) {
        posthog.register({ utm_source:source, utm_medium:medium, utm_campaign:campaign });
        track('$pageview');
        track('download_link_opened');
        track('tiktok_bio_link_clicked');
      }

      // If the page goes hidden, a handoff worked. Record which step did it and stop escalating.
      var handedOff = false, lastStep = 'none';
      function onHide(){
        if (handedOff || !document.hidden) return;
        handedOff = true;
        track('download_handoff_succeeded', { escape_step: lastStep });
      }
      document.addEventListener('visibilitychange', onHide);
      window.addEventListener('pagehide', onHide);

      function nav(url, step){ lastStep = step; track('download_escape_attempt', { escape_step: step }); window.location.href = url; }

      function showManual(){
        if (handedOff) return;
        track('download_escape_failed', { escape_step: lastStep });
        document.getElementById('dlTitle').textContent = 'Open in your browser to install';
        document.getElementById('dlSub').textContent = (hitObj && hitObj.name === 'instagram' ? 'Instagram' : 'This app') + "'s built-in browser can't open the App Store. It takes a second to switch.";
        document.getElementById('dlHint').hidden = true;
        document.getElementById('dlSteps').hidden = false;
        var copy = document.getElementById('dlCopy');
        copy.hidden = false;
        copy.addEventListener('click', function(){
          var done = function(){ copy.textContent = 'link copied, paste it in your browser'; };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(selfUrl).then(done).catch(done);
          else { var ta=document.createElement('textarea'); ta.value=selfUrl; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} document.body.removeChild(ta); }
          track('download_link_copied');
        });
      }

      // --- routing ---------------------------------------------------------
      if (!inApp || escaped) {
        // A real browser: the plain App Store URL works.
        setTimeout(function(){ nav(appStoreUrl, 'direct'); }, 650);
        return;
      }
      if (!isIOS) {
        // Android in-app: the iOS app is not the destination anyway, so send
        // them somewhere that works in any webview.
        document.getElementById('dlTitle').textContent = 'Iro runs in your browser';
        document.getElementById('dlSub').textContent = 'The iOS app is coming to Android. Start learning right now at app.tryiro.com, and your progress carries over.';
        link.href = 'https://app.tryiro.com/?' + q;
        link.textContent = 'Open the web app';
        document.getElementById('dlHint').hidden = true;
        track('download_android_webapp_offered');
        return;
      }

      // iOS in-app browser: try to hand off before falling back to instructions.
      // Step 1 asks iOS to reopen this URL in Safari, which is the escape most
      // likely to survive; step 2 tries the App Store's own scheme; step 3 is
      // the manual card. Each step is tracked so the data tells us what still
      // works rather than us guessing.
      nav('x-safari-' + selfUrl, 'x-safari');
      setTimeout(function(){ if (!handedOff && !document.hidden) nav(itmsUrl, 'itms-apps'); }, 900);
      setTimeout(function(){ if (!handedOff && !document.hidden) showManual(); }, 2000);
    })();
  </script>
